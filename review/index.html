<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Janitor applications: review</title>
<style>
:root{--bg:#000;--panel:#222;--nav:#333;--line:#4d4d4d;--link:#ffee95;--hover:#f68b00;--accent:#e8c446;--text:#fff;--muted:#cbb295;--ok:#4ccf5f;--bad:#ff5a5a;--input:#333;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Verdana,Tahoma,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{color:var(--hover)}
header{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:6px 14px}
header img{display:block;height:32px;width:auto}header .logo{font-size:22px;font-weight:bold;color:var(--accent)}
header .stage{color:var(--accent);font-size:18px;font-weight:bold}
.side{width:230px;flex:none}.side aside{width:100%}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .btn{flex:1}
.btn.on{background:var(--accent);border-color:var(--accent);color:#000}
main h2 a{color:var(--accent);border-bottom:1px dotted var(--accent)}main h2 a:hover{color:var(--hover);border-color:var(--hover)}
.badge{display:inline-block;padding:2px 14px;border-radius:2px;color:#000;font-weight:bold;margin:6px 0 2px}.badge.ok{background:var(--ok)}.badge.bad{background:var(--bad)}.badge.none{background:var(--nav);color:var(--muted)}
.sum{font-size:inherit;font-weight:bold;margin-left:6px;white-space:nowrap}
.st-advance{color:var(--ok)}.st-reject{color:var(--bad)}.st-hold{color:var(--muted)}
.wrap{display:flex;gap:14px;max-width:1280px;margin:14px auto;padding:0 12px;align-items:flex-start}
aside{width:230px;flex:none;background:var(--panel);padding:10px;border-radius:3px}
aside h3,main h2{margin:0 0 8px;font-size:15px;color:var(--accent)}
aside ol{list-style:none;margin:0;padding:0}
aside li button{all:unset;display:flex;width:100%;gap:6px;padding:3px 4px;cursor:pointer;color:var(--link);border-radius:2px;box-sizing:border-box}
aside li button:hover{background:var(--nav);color:var(--hover)}
aside li button.cur{background:var(--nav);color:var(--text);font-weight:bold}
aside .tag{margin-left:auto;font-size:11px}
.a{color:var(--ok)}.d{color:var(--bad)}
main{flex:1;min-width:0;background:var(--panel);padding:14px 16px;border-radius:3px}
.media{background:#000;text-align:center;padding:8px;margin:6px 0 10px;overflow:auto}
.media img,.media video{max-width:100%;height:auto;vertical-align:top}
.media .fail{padding:30px 10px;color:var(--muted)}.media .fail code{color:var(--text)}
label{display:block;margin:12px 0 3px;font-weight:bold}
input,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);padding:6px 8px;font:inherit;border-radius:2px}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--bad);font-size:12px;min-height:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{background:var(--nav);color:var(--link);border:1px solid var(--line);padding:6px 14px;font:inherit;cursor:pointer;border-radius:2px}
.btn:hover{background:#000;color:var(--hover)}
.rev{border-top:1px solid var(--line);padding:8px 0}
.rev pre{white-space:pre-wrap;margin:4px 0 0;font:inherit;color:var(--text)}
.small{color:var(--muted);font-size:12px}
@media(max-width:800px){.wrap{flex-direction:column}aside,.side{width:100%}}
</style>
</head>
<body>
<header><img id="logo" alt="e6AI" height="32"><span class="stage">Janitor applications: review</span></header>
<div class="wrap" id="wrap"></div>
<script>
// ---- Config -------------------------------------------------------------
// Address of your Cloudflare Worker, without a trailing slash.
const WORKER = "https://janitor-intake.jelloponies.workers.dev";
// Post media is looked up here first (same files as the applicant page), then at the original link.
const MEDIA = "../stage-2/posts/";

const LS = "e6ai-janitor-review";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let stage = location.hash === "#stage1" ? 1 : 2;
let key = "", apps = [], cur = 0, G = {};
const GK = () => LS + (stage === 1 ? "-grades1" : "-grades");
const DIR = () => stage === 1 ? "stage1" : "applications";
try{key=localStorage.getItem(LS+"-key")||"";}catch(e){}
function loadG(){try{G=JSON.parse(localStorage.getItem(GK())||"{}");}catch(e){G={};}}
const gsave=()=>{try{localStorage.setItem(GK(),JSON.stringify(G));}catch(e){}};
function setStage(n){
  if(n!==stage){stage=n;try{history.replaceState(null,"",n===1?"#stage1":location.pathname+location.search);}catch(e){}}
  loadG();apps=[];cur=0;tabs();key?load():login();
}
function tabs(){const a=$("#t1"),b=$("#t2");if(a)a.classList.toggle("on",stage===1);if(b)b.classList.toggle("on",stage===2);}
window.addEventListener("hashchange",()=>{const n=location.hash==="#stage1"?1:2;if(n!==stage)setStage(n);});

(function(){const el=$("#logo"),u=["../stage-2/logo.svg","https://e6ai.net/vite/assets/default-CKI9Mcpt.svg"];let k=0;
  el.referrerPolicy="no-referrer";
  el.addEventListener("error",()=>{if(++k<u.length)el.src=u[k];else{const t=document.createElement("span");t.className="logo";t.textContent="e6AI";el.replaceWith(t);}});
  el.src=u[0];})();

function mount(el){
  const urls=[MEDIA+"post-"+el.dataset.n+"."+el.dataset.e,el.dataset.u],vid=/^(mp4|webm)$/.test(el.dataset.e);let k=0;
  const n=document.createElement(vid?"video":"img");
  if(vid){n.controls=true;n.preload="metadata";}else n.alt="";
  n.referrerPolicy="no-referrer";
  n.addEventListener("error",()=>{if(++k<urls.length){n.src=urls[k];return;}
    el.innerHTML=`<div class="fail">This ${vid?"clip":"image"} could not be loaded. <a href="${esc(urls[1])}" target="_blank" rel="noopener">Open the original link</a>.</div>`;});
  n.src=urls[0];el.appendChild(n);
}

// ---- Sign-in and loading -------------------------------------------------
function login(msg){
  $("#wrap").innerHTML=`<main style="max-width:520px;margin:30px auto"><h2>Staff sign-in</h2>
    <p class="small">Enter the staff key you were given. It is stored in this browser only.</p>
    <label for="k">Staff key</label><input id="k" type="password" autocomplete="off">
    <div class="err">${esc(msg||"")}</div><div class="row"><button class="btn" id="go">Sign in</button></div></main>`;
  $("#go").onclick=()=>{key=$("#k").value.trim();if(!key)return;try{localStorage.setItem(LS+"-key",key);}catch(e){}load();};
  $("#k").addEventListener("keydown",e=>{if(e.key==="Enter")$("#go").click();});
}
function signOut(){try{localStorage.removeItem(LS+"-key");}catch(e){}key="";apps=[];login();}
async function api(p){
  const r=await fetch(WORKER+p,{headers:{Authorization:"Bearer "+key}});
  if(r.status===401){const e=new Error("auth");e.auth=1;throw e;}
  if(!r.ok)throw new Error("http "+r.status);
  return r.json();
}
async function load(){
  $("#wrap").innerHTML='<main style="max-width:520px;margin:30px auto"><p>Loading applications…</p></main>';
  try{
    const my=stage,dir=DIR(),list=[];
    const {files}=await api("/"+dir);let i=0;
    const w=async()=>{while(i<files.length){const n=files[i++];
      try{const j=await api("/"+dir+"/"+encodeURIComponent(n));j._f=n;list.push(j);}catch(e){if(e.auth)throw e;}}};
    await Promise.all([1,2,3,4,5,6].map(w));
    if(my!==stage)return;
    apps=list;apps.sort((a,b)=>a._f<b._f?1:-1);cur=0;
    $("#wrap").innerHTML=`<div class="side"><div class="tabs"><button class="btn" id="t1" onclick="setStage(1)">Stage 1</button><button class="btn" id="t2" onclick="setStage(2)">Stage 2</button></div><aside><h3>Stage ${stage} applications</h3><ol id="list"></ol>
      <div class="row"><button class="btn" onclick="load()">Refresh</button><button class="btn" onclick="csv()">Export CSV</button><button class="btn" onclick="signOut()">Sign out</button></div></aside></div><main id="main"></main>`;
    tabs();renderList();show();
  }catch(e){
    if(e.auth){try{localStorage.removeItem(LS+"-key");}catch(x){}key="";login("That staff key was not accepted.");}
    else $("#wrap").innerHTML='<main style="max-width:520px;margin:30px auto"><p class="d">Could not load applications. Check the Worker address and your connection.</p><div class="row"><button class="btn" onclick="load()">Try again</button><button class="btn" onclick="signOut()">Sign out</button></div></main>';
  }
}

// ---- Scoring and display -------------------------------------------------
const gr=(a,i)=>((G[a._f]||{}).p||[])[i]||{};
const dec=x=>(x.answer.trim().split(/\s+/)[0]||"").toLowerCase().replace(/[^a-z]/g,"");
const ext=u=>u.split("?")[0].split(".").pop().toLowerCase();
function setG(i,f,v){
  const a=apps[cur],g=G[a._f]=G[a._f]||{p:[],n:""};
  if(i<0)g.n=v;else{g.p[i]=g.p[i]||{};g.p[i][f]=v;}
  gsave();
}
const STATUS=[["","Undecided"],["advance","Advance to stage 2"],["hold","Hold"],["reject","Reject"]];
const uidOf=a=>String(stage===1?a.user_id:a.e6ai_user_id||"").replace(/\D/g,"");
const label=a=>uidOf(a)?"#"+uidOf(a)+" "+a.discord_username:(a.e6ai_username||a.discord_username);
function sum(a){let ap=0,de=0;a.answers.forEach(x=>{const d=dec(x);if(d==="approve")ap++;else if(d==="delete")de++;});
  return `<span class="sum" title="${ap} approved, ${de} deleted">(<span class="a">${ap}</span>/<span class="d">${de}</span>)</span>`;}
function verdict(x){const d=dec(x),b=d==="approve"?["ok","Approved"]:d==="delete"?["bad","Deleted"]:null;
  return b?`<span class="badge ${b[0]}">${b[1]}</span><pre>${esc(x.answer.trim().replace(/^\S+\s*/,""))}</pre>`:`<span class="badge none">No clear decision</span><pre>${esc(x.answer)}</pre>`;}
const heading=a=>uidOf(a)?`<a href="https://e6ai.net/users/${uidOf(a)}" target="_blank" rel="noopener" title="Open this user's profile on e6ai">User #${uidOf(a)}</a> &middot; ${esc(a.discord_username)}`:`${esc(a.e6ai_username||"Unknown user")} &middot; ${esc(a.discord_username)}`;
function tag(a){
  if(stage===1){const d=(G[a._f]||{}).d||"";return d?`<span class="tag st-${esc(d)}">${esc((STATUS.find(x=>x[0]===d)||[0,d])[1].replace(" to stage 2",""))}</span>`:'<span class="tag a">new</span>';}
  return `<span class="tag">${sum(a)}</span>`;
}
function renderList(){
  $("#list").innerHTML=apps.length?apps.map((a,i)=>`<li><button class="${i===cur?'cur':''}" onclick="cur=${i};renderList();show()"><span>${esc(label(a))}</span>${tag(a)}</button></li>`).join(""):'<li class="small">No applications yet.</li>';
}
function setStatus(v){const a=apps[cur],g=G[a._f]=G[a._f]||{p:[],n:""};g.d=v;gsave();renderList();}
function show(){stage===1?show1():show2();}
function show2(){
  const a=apps[cur];
  if(!a){$("#main").innerHTML='<h2>No applications yet</h2><p class="small">New submissions appear here after you press Refresh.</p>';return;}
  $("#main").innerHTML=`<h2>${heading(a)}${sum(a)}</h2>
    <p class="small">${esc(a.email)} &middot; ${esc(new Date(a.submitted).toLocaleString())}</p>`+
  a.answers.map((x,i)=>{const g=gr(a,i);
    return `<div class="rev"><b>Post ${esc(x.post)}</b>
      <div class="media" data-n="${esc(x.post)}" data-e="${esc(ext(x.url))}" data-u="${esc(x.url)}"></div>
      ${verdict(x)}
      <div class="row"><input style="flex:1" placeholder="Notes" value="${esc(g.c||"")}" onchange="setG(${i},'c',this.value)"></div></div>`;}).join("")+
  `<label>Overall notes</label><textarea onchange="setG(-1,'n',this.value)">${esc((G[a._f]||{}).n||"")}</textarea>`;
  document.querySelectorAll("#main .media").forEach(mount);
}
function show1(){
  const a=apps[cur];
  if(!a){$("#main").innerHTML='<h2>No applications yet</h2><p class="small">New submissions appear here after you press Refresh.</p>';return;}
  const g=G[a._f]||{},d=g.d||"";
  $("#main").innerHTML=`<h2>${heading(a)}</h2>
    <p class="small">${esc(a.email)} &middot; Timezone: ${esc(a.timezone)} &middot; 18+: <span class="${a.over18==="yes"?"a":"d"}">${esc(a.over18||"unanswered")}</span> &middot; Referred by: ${esc(a.referral||"nobody listed")} &middot; ${esc(new Date(a.submitted).toLocaleString())}</p>
    <div class="row" style="margin-top:0"><b>Decision</b><select class="btn" onchange="setStatus(this.value)">${STATUS.map(([v,t])=>`<option value="${v}" ${d===v?"selected":""}>${t}</option>`).join("")}</select></div>`+
  a.answers.map((x,i)=>`<div class="rev"><b style="white-space:pre-wrap">${esc(x.q)}</b>
      <pre>${esc(x.answer)}</pre>
      <div class="row"><input style="flex:1" placeholder="Notes" value="${esc(gr(a,i).c||"")}" onchange="setG(${i},'c',this.value)"></div></div>`).join("")+
  `<label>Overall notes</label><textarea onchange="setG(-1,'n',this.value)">${esc(g.n||"")}</textarea>`;
}
function csv(){stage===1?csv1():csv2();}
function csv1(){
  const q=v=>{v=String(v??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';};
  const qs=[];apps.forEach(a=>a.answers.forEach(x=>{if(!qs.includes(x.q))qs.push(x.q);}));
  const h=["submitted","user_id","email","discord","timezone","over18","referral","decision"];
  qs.forEach((t,i)=>h.push("q"+(i+1)+": "+t.replace(/\s+/g," ").slice(0,80),"q"+(i+1)+"_notes"));h.push("overall_notes");
  const rows=apps.map(a=>{const g=G[a._f]||{};
    const cells=qs.flatMap(t=>{const i=a.answers.findIndex(x=>x.q===t);return i<0?["",""]:[a.answers[i].answer,gr(a,i).c??""];});
    return [a.submitted,a.user_id,a.email,a.discord_username,a.timezone,a.over18,a.referral,(STATUS.find(x=>x[0]===(g.d||""))||[0,""])[1],...cells,g.n||""];});
  download([h,...rows].map(r=>r.map(q).join(",")).join("\n"),"janitor-stage1-results.csv");
}
function download(text,name){
  const b=new Blob([text],{type:"text/csv"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download=name;l.click();URL.revokeObjectURL(l.href);
}
function csv2(){
  const q=v=>{v=String(v??"");if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';},n=Math.max(0,...apps.map(a=>a.answers.length)),h=["submitted","user_id","email","discord"];
  for(let i=1;i<=n;i++)h.push("p"+i+"_decision","p"+i+"_notes");h.push("overall_notes");
  const rows=apps.map(a=>[a.submitted,uidOf(a)||a.e6ai_username||"",a.email,a.discord_username,...a.answers.flatMap((x,i)=>[dec(x),gr(a,i).c??""]),(G[a._f]||{}).n||""]);
  download([h,...rows].map(r=>r.map(q).join(",")).join("\n"),"janitor-results.csv");
}

loadG();key?load():login();
</script>
</body>
</html>
